version: "3.8"

# Local development only. For production, use a managed Postgres (RDS, Render,
# Railway, Supabase, etc.) rather than running Postgres in a container
# yourselves — managed backups and failover are worth paying for.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vjcrawford
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/vjcrawford
      JWT_SECRET: local-dev-secret-change-me
      JWT_EXPIRES_IN: 12h
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"

volumes:
  db_data:
